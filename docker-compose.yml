services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - iota-net
    restart: unless-stopped

  traceability:
    build: .
    container_name: traceability
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/data/traceability.db
      - HORNET_URL=http://iota-hornet:14265
      - MQTT_HOST=mosquitto
    volumes:
      - ./data:/data
    depends_on:
      - mosquitto
    networks:
      - iota-net
    restart: unless-stopped

  iota-api:
    image: iota_api
    container_name: iota-api
    ports:
      - "5555:5555"
    environment:
      - PYTHONUNBUFFERED=1
      - TRACEABILITY_URL=http://traceability:8000/messages
      - MQTT_HOST=mosquitto
    depends_on:
      - traceability
      - mosquitto
    networks:
      - iota-net
    restart: unless-stopped

networks:
  iota-net:
    external: true
